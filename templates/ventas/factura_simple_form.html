{% extends "base/menu.html" %}
{% load static %}

{% block styles %}
<link rel="stylesheet" href="{% static 'css/ventas/inventario.css' %}">
{% endblock %}

{% block content %}
<div class="inv-page">
  <div class="inv-header mb-3">
    <div>
      <h2 class="page-title mb-0">Nueva factura</h2>
      <p class="text-muted mb-0">Selecciona un producto del inventario y guarda.</p>
    </div>
    <a href="{% url 'ventas:listar' %}" class="btn btn-outline-secondary">Volver</a>
  </div>

  <div class="card inv-card"><div class="card-body">
    <form method="post" class="row g-3" novalidate>
      {% csrf_token %}
      <div class="col-md-3">
        <label class="form-label">Consecutivo</label>
        <input name="consecutivo" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Fecha emisión</label>
        <input type="date" name="fecha_emision" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Fecha vencimiento</label>
        <input type="date" name="fecha_vencimiento" class="form-control">
      </div>
      <div class="col-md-3">
        <label class="form-label">Moneda</label>
        <select name="moneda" class="form-select"><option value="CRC">CRC</option><option value="USD">USD</option></select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Tipo de cambio</label>
        <input type="number" step="0.0001" min="0.0001" name="tipo_cambio" class="form-control" placeholder="Requerido para USD">
      </div>

      <div class="col-md-4">
        <label class="form-label">Cliente</label>
        <select name="cliente" class="form-select" required>
          <option value="">Seleccione...</option>
          {% for c in clientes %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Almacén</label>
        <select name="almacen" class="form-select">
          <option value="">No aplica</option>
          {% for a in almacenes %}<option value="{{ a.id }}">{{ a.nombre }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Producto / servicio</label>
        <select name="producto" class="form-select" required>
          <option value="">Seleccione...</option>
          {% for p in productos %}<option value="{{ p.id }}">{{ p.codigo }} - {{ p.nombre }} ({{ p.precio_venta }})</option>{% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Cantidad</label>
        <input type="number" step="0.001" min="0.001" name="cantidad" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Descuento %</label>
        <input type="number" step="0.01" min="0" max="100" name="porcentaje_descuento" class="form-control" value="0">
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" value="SI" id="emitir" name="emitir">
          <label class="form-check-label" for="emitir">Emitir al guardar (rebaja stock)</label>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label">Notas</label>
        <textarea name="notas" rows="2" class="form-control"></textarea>
      </div>

      <div class="col-12 text-end">
        <button class="btn btn-primary">Guardar factura</button>
      </div>
    </form>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
{% include "base/_swal_messages.html" %}
<script src="{% static 'js/ventas/inventario.js' %}"></script>
{% endblock %}
