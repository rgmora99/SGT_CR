{% extends "base/menu.html" %}
{% load static %}

{% block styles %}
<link rel="stylesheet" href="{% static 'css/ventas/ventas.css' %}">
{% endblock %}

{% block content %}

<div class="venta-nueva-page">

  <!-- ===== ENCABEZADO ===== -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h2 class="page-title mb-0">Nueva Venta</h2>
      <p class="text-muted mb-0">
        Registra una venta de forma rápida y ordenada.
      </p>
    </div>
    <a href="{% url 'ventas:listar' %}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i> Volver
    </a>
  </div>

  <form method="post">
    {% csrf_token %}

    <!-- ===== DATOS DE LA VENTA ===== -->
    <div class="card shadow-sm border-0 rounded-4 mb-4">
      <div class="card-body">
        <h6 class="fw-semibold mb-3">
          <i class="bi bi-receipt me-2 text-primary"></i> Datos de la venta
        </h6>

        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha_venta" class="form-control" required>
          </div>

          <div class="col-md-4">
            <label class="form-label">Tipo</label>
            <select name="tipo_venta" class="form-select">
              <option value="CONTADO">Contado</option>
              <option value="CREDITO">Crédito</option>
              <option value="COTIZACION">Cotización</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Estado</label>
            <select name="estado" class="form-select">
              <option value="PENDIENTE">Pendiente</option>
              <option value="PAGADA">Pagada</option>
            </select>
          </div>

          <div class="col-md-12">
            <label class="form-label">Observaciones</label>
            <textarea name="observaciones" class="form-control" rows="2"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== CLIENTE ===== -->
    <div class="card shadow-sm border-0 rounded-4 mb-4">
      <div class="card-body">
        <h6 class="fw-semibold mb-3">
          <i class="bi bi-person me-2 text-success"></i> Cliente
        </h6>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Cliente</label>
            <select name="cliente" class="form-select" required>
              <option disabled selected>Seleccione...</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Identificación</label>
            <input type="text" name="identificacion" class="form-control">
          </div>
        </div>
      </div>
    </div>

    <!-- ===== PRODUCTOS / SERVICIOS ===== -->
    <div class="card shadow-sm border-0 rounded-4 mb-4">
      <div class="card-body">
        <h6 class="fw-semibold mb-3">
          <i class="bi bi-box-seam me-2 text-info"></i> Productos / Servicios
        </h6>

        <textarea name="detalle_productos"
                  class="form-control"
                  rows="4"
                  placeholder="Producto | Cantidad | Precio"></textarea>
      </div>
    </div>

    <!-- ===== TOTALES ===== -->
    <div class="card shadow-sm border-0 rounded-4 mb-4">
      <div class="card-body">
        <h6 class="fw-semibold mb-3">
          <i class="bi bi-calculator me-2 text-warning"></i> Totales
        </h6>

        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Subtotal</label>
            <input type="number" name="subtotal" class="form-control">
          </div>

          <div class="col-md-4">
            <label class="form-label">Impuestos</label>
            <input type="number" name="impuestos" class="form-control">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Total</label>
            <input type="number" name="total" class="form-control fw-semibold" required>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== PAGO Y FACTURACIÓN ===== -->
    <div class="card shadow-sm border-0 rounded-4 mb-4">
      <div class="card-body">
        <h6 class="fw-semibold mb-3">
          <i class="bi bi-credit-card me-2 text-secondary"></i> Pago y facturación
        </h6>

        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Método de pago</label>
            <select name="metodo_pago" class="form-select">
              <option>EFECTIVO</option>
              <option>SINPE</option>
              <option>TARJETA</option>
              <option>TRANSFERENCIA</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Condición</label>
            <select name="condicion_venta" class="form-select">
              <option>CONTADO</option>
              <option>CREDITO</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">¿Facturar ahora?</label>
            <select name="facturar" class="form-select">
              <option value="NO">No</option>
              <option value="SI">Sí</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== ACCIONES ===== -->
    <div class="d-flex justify-content-end gap-2">
      <a href="{% url 'ventas:listar' %}" class="btn btn-outline-secondary">
        Cancelar
      </a>
      <button type="submit" class="btn btn-success">
        <i class="bi bi-check-circle me-1"></i> Guardar venta
      </button>
    </div>

  </form>
</div>

{% endblock %}
