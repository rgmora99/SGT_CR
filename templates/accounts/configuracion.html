{% extends "base/menu.html" %}
{% block content %}

<div class="container-fluid">

  <div class="hero-header mb-4">
    <h2>Configuración</h2>
    <p>Gestiona la información del negocio activo.</p>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-12">

      <div class="card config-card shadow-sm">

        <div class="config-header">
          <div>
            <h5 class="mb-0">{{ negocio.nombre_comercial }}</h5>
            <small class="text-muted">ID negocio: {{ negocio.id_negocio }}</small>
          </div>
        </div>

        <ul class="nav nav-tabs config-tabs">
          <li class="nav-item">
            <a class="nav-link active" data-toggle="tab" href="#pane-negocio">Negocio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-toggle="tab" href="#pane-fiscal">Perfil fiscal</a>
          </li>
        </ul>

        <div class="tab-content pt-4">

          <!-- ================= NEGOCIO ================= -->
          <div class="tab-pane fade show active" id="pane-negocio">
            <form method="post">
              {% csrf_token %}
              <input type="hidden" name="form_type" value="negocio">

              <div class="row form-section">
                <div class="col-md-6 mb-3">
                  <label>Nombre comercial</label>
                  <input type="text" class="form-control" name="nombre_comercial"
                         value="{{ negocio.nombre_comercial }}" required>
                </div>

                <div class="col-md-6 mb-3">
                  <label>Provincia</label>
                  <select class="form-control" name="provincia" required>
                    {% for value, label in provincias %}
                      <option value="{{ value }}" {% if negocio.provincia == value %}selected{% endif %}>
                        {{ label }}
                      </option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-md-6 mb-3">
                  <label>Moneda base</label>
                  <select class="form-control" name="moneda_base">
                    <option value="CRC" {% if negocio.moneda_base == "CRC" %}selected{% endif %}>Colones (CRC)</option>
                    <option value="USD" {% if negocio.moneda_base == "USD" %}selected{% endif %}>Dólares (USD)</option>
                  </select>
                </div>
              </div>

              <div class="form-actions">
                <button class="btn btn-primary">Guardar cambios</button>
              </div>
            </form>
          </div>

          <!-- ================= PERFIL FISCAL ================= -->
          <div class="tab-pane fade" id="pane-fiscal">
            <form method="post">
              {% csrf_token %}
              <input type="hidden" name="form_type" value="fiscal">

              <div class="row form-section">
                <div class="col-md-6 mb-3">
                  <label>Tipo identificación</label>
                  <select class="form-control" name="tipo_identificacion">
                    <option value="fisica" {% if config_fiscal.tipo_identificacion == "fisica" %}selected{% endif %}>Persona física</option>
                    <option value="juridica" {% if config_fiscal.tipo_identificacion == "juridica" %}selected{% endif %}>Persona jurídica</option>
                  </select>
                </div>

                <div class="col-md-6 mb-3">
                  <label>Identificación</label>
                  <input type="text" class="form-control" name="identificacion"
                         value="{{ config_fiscal.identificacion }}">
                </div>

                <div class="col-md-6 mb-3">
                  <label>¿Aplica IVA?</label>
                  <select class="form-control" name="aplica_iva">
                    <option value="true" {% if config_fiscal.aplica_iva %}selected{% endif %}>Sí</option>
                    <option value="false" {% if not config_fiscal.aplica_iva %}selected{% endif %}>No</option>
                  </select>
                </div>

                <div class="col-md-6 mb-3">
                  <label>% IVA</label>
                  <input type="number" step="0.01" class="form-control" name="porc_iva"
                         value="{{ config_fiscal.porc_iva|default:'13' }}">
                </div>

                <div class="col-md-6 mb-3">
                  <label>Periodo IVA</label>
                  <select class="form-control" name="periodo_iva">
                    <option value="mensual" {% if config_fiscal.periodo_iva == "mensual" %}selected{% endif %}>Mensual</option>
                    <option value="trimestral" {% if config_fiscal.periodo_iva == "trimestral" %}selected{% endif %}>Trimestral</option>
                  </select>
                </div>
              </div>

              <div class="form-actions">
                <button class="btn btn-primary">Guardar perfil fiscal</button>
              </div>
            </form>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  $(function () {
    const hash = window.location.hash;
    if (hash) {
      $('.nav-tabs a[href="#pane-' + hash.replace('#','') + '"]').tab('show');
    }

    $('.nav-tabs a').on('shown.bs.tab', function (e) {
      const id = $(e.target).attr('href').replace('#pane-', '#');
      history.replaceState(null, null, id);
    });
  });
</script>

{% endblock %}
