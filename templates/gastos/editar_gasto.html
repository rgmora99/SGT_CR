{% extends "base/menu.html" %}
{% block content %}

<div class="container-fluid">
  <h2>Editar gasto</h2>
  <p class="text-muted">Solo se permiten cambios administrativos.</p>

  <form method="post" class="card p-4">
    {% csrf_token %}

    <div class="row g-3">

      <div class="col-md-4">
        <label>Categoría</label>
        <select name="categoria" class="form-select">
          {% for c in categorias %}
            <option value="{{ c.id }}"
              {% if gasto.categoria_id == c.id %}selected{% endif %}>
              {{ c.nombre }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label>Fecha del gasto</label>
        <input type="date"
               name="fecha_gasto"
               class="form-control"
               value="{{ gasto.fecha_gasto|date:'Y-m-d' }}">
      </div>

      <div class="col-md-4">
        <label>Método de pago</label>
        <select name="metodo_pago" class="form-select">
          <option value="">---</option>
          <option value="EFECTIVO" {% if gasto.metodo_pago == "EFECTIVO" %}selected{% endif %}>Efectivo</option>
          <option value="TRANSFERENCIA" {% if gasto.metodo_pago == "TRANSFERENCIA" %}selected{% endif %}>Transferencia</option>
          <option value="TARJETA" {% if gasto.metodo_pago == "TARJETA" %}selected{% endif %}>Tarjeta</option>
        </select>
      </div>

      <div class="col-md-12">
        <label>Notas</label>
        <textarea name="notas" class="form-control">{{ gasto.notas }}</textarea>
      </div>

    </div>

    <div class="mt-3 text-end">
      <a href="{% url 'gastos:listado_gastos' %}" class="btn btn-outline-secondary">
        Cancelar
      </a>
      <button class="btn btn-primary">Guardar cambios</button>
    </div>

  </form>
</div>

{% endblock %}
