{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear cuenta</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

<div class="login-page">
  <div class="login-card">

    <h5 class="text-center mb-2">Crear cuenta</h5>
    <p class="text-muted text-center mb-4">
      Empieza a gestionar tu información contable
    </p>

    <form method="post" action="">
      {% csrf_token %}

      <!-- NOMBRE -->
      <div class="form-group text-left">
        <label>Nombre </label>
        <input type="text" name="nombre" class="form-control" required>
      </div>
      <div class="form-group text-left">
        <label>Apellido 1 </label>
        <input type="text" name="apellido1" class="form-control" required>
      </div>
      <div class="form-group text-left">
        <label>Apellido 2 </label>
        <input type="text" name="apellido2" class="form-control" required>
      </div>

      <!-- EMAIL -->
      <div class="form-group text-left">
        <label>Correo electrónico</label>
        <input type="email" name="email" class="form-control" required>
      </div>

      <!-- USERNAME -->
      <div class="form-group text-left">
        <label>Usuario</label>
        <input type="text" name="username" class="form-control" required>
      </div>

      <!-- PASSWORD -->
      <div class="form-row">
        <div class="form-group col">
          <label>Contraseña</label>
          <input type="password" name="password1" class="form-control" required>
        </div>

        <div class="form-group col">
          <label>Confirmar</label>
          <input type="password" name="password2" class="form-control" required>
        </div>
      </div>

      <!-- ERRORES -->
      {% if form.errors %}
        <div class="alert alert-danger mt-3">
          {{ form.errors }}
        </div>
      {% endif %}

      <button type="submit" class="btn btn-primary w-100 mt-3">
        Crear cuenta
      </button>
    </form>

    <div class="text-center mt-3 small">
      ¿Ya tienes cuenta?
      <a href="{% url 'accounts:login' %}" class="marca">Iniciar sesión</a>
    </div>

  </div>
</div>

</body>
</html>
